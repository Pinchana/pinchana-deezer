[project]
name = "pinchana-deezer"
version = "26.9.2"
description = "Deezer music downloader for Pinchana"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pinchana-core",
    "deezer-python>=7.4.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "ytmusicapi>=1.12.2",
]

[tool.uv.sources]
pinchana-core = { path = "../pinchana-core" }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
